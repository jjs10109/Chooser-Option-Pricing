[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "option-iv-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "yfinance>=0.2.54,<1", "python-dotenv>=1,<2", "numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "xgboost>=2,<4", "matplotlib>=3.8,<4"]
[project.optional-dependencies]
dashboard = ["streamlit>=1.50,<2", "plotly>=5.24,<7"]

[project.scripts]
option-iv = "option_iv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
